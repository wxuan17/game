<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff1f5">

  <title>生日命運目的地 🎂</title>

  <style>

    :root {
      color-scheme: light;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at 50% 15%,
          #fff9fb,
          #ffe7ee 67%,
          #ffdae6
        );

      color: #65364d;
    }

    main {
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 1.8rem;

      padding: 48px 20px;

      text-align: center;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      user-select: none;

      touch-action: manipulation;
    }

    .eyebrow {
      font-size: .8rem;
      font-weight: 750;
      letter-spacing: .35em;
      color: #ba6b8d;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 3.6rem);
      line-height: 1.18;

      margin: .6rem 0 0;

      letter-spacing: .03em;
    }

    .subtitle {
      font-size: .96rem;
      color: #98667b;
      margin: .8rem 0 0;
    }

    .card {
      width: min(100%, 580px);

      min-height: 270px;

      border: 2px solid #ffffffad;

      border-radius: 32px;

      background: #ffffffbf;

      box-shadow: 0 18px 50px #b7608424;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 22px;

      padding: 30px 18px;
    }

    .caption {
      font-size: .82rem;
      letter-spacing: .24em;
      font-weight: 700;
      color: #b36f89;
    }

    .place {
      font-size: clamp(2.8rem, 12vw, 5rem);

      font-weight: 850;

      line-height: 1.2;

      overflow-wrap: anywhere;
    }

    .place.pop {
      animation: pop .35s ease-out both;
    }

    .hint {
      font-size: clamp(1.06rem, 4.4vw, 1.35rem);

      font-weight: 700;

      background: #bd507d;

      color: white;

      padding: 17px 24px;

      border-radius: 999px;

      box-shadow: 0 8px 24px #bd507d32;
    }

    .fine {
      font-size: .85rem;
      color: #997184;
    }

    @keyframes pop {

      0% {
        transform: scale(.84);
      }

      65% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

    @media (prefers-reduced-motion: reduce) {

      .place.pop {
        animation: none;
      }

    }

  </style>

</head>


<body>

  <main
    id="play"
    role="button"
    tabindex="0"
    aria-label="點擊畫面操作生日目的地抽選"
  >

    <header>

      <div class="eyebrow">
        BIRTHDAY DESTINY
      </div>

      <h1>
        🎂 HAPPY BIRTHDAY!
      </h1>

      <p class="subtitle">
        Where will fate take us today?
      </p>

    </header>


    <section
      class="card"
      aria-label="生日目的地抽選"
    >

      <div
        class="caption"
        id="caption"
      >
        WHERE ARE WE GOING?
      </div>

      <div
        class="place"
        id="place"
      >
        台北市
      </div>

      <div
        class="fine"
        id="subtext"
      >
        第一階段：命運縣市選擇 ✨
      </div>

    </section>


    <div
      class="hint"
      id="hint"
      aria-live="polite"
    >
      👆 輕觸畫面任意處，即可暫停
    </div>


    <div class="fine">
      每 0.05 秒（50 毫秒）切換一次
    </div>

  </main>



  <script>

    // ========================================
    // 第一階段：縣市清單
    // ========================================

    const destinations = [

      '台北市',
      '新北市',
      '基隆市',
      '桃園市',
      '新竹縣市'

    ];



    // ========================================
    // 第二階段：各縣市目的地
    //
    // 不包含宜蘭
    // 不包含夜市、商圈
    // 避免登山景點
    // 盡量使用地區名稱
    // ========================================

    const attractions = {

      // ===== 台北市 =====

'台北市': [

  // ===== 文湖線 =====
  '動物園',
  '木柵',
  '萬芳社區',
  '萬芳醫院',
  '辛亥',
  '麟光',
  '六張犁',
  '科技大樓',
  '大安',
  '忠孝復興',
  '南京復興',
  '中山國中',
  '松山機場',
  '大直',
  '劍南路',
  '西湖',
  '港墘',
  '文德',
  '內湖',
  '大湖公園',
  '葫洲',
  '東湖',
  '南港軟體園區',
  '南港展覽館',

  // ===== 淡水信義線 =====
  '關渡',
  '忠義',
  '復興崗',
  '北投',
  '新北投',
  '奇岩',
  '唭哩岸',
  '石牌',
  '明德',
  '芝山',
  '士林',
  '劍潭',
  '圓山',
  '民權西路',
  '雙連',
  '中山',
  '台北車站',
  '台大醫院',
  '中正紀念堂',
  '東門',
  '大安森林公園',
  '信義安和',
  '台北101/世貿',
  '象山',
  '廣慈/奉天宮',

  // ===== 松山新店線 =====
  '景美',
  '萬隆',
  '公館',
  '台電大樓',
  '古亭',
  '小南門',
  '西門',
  '北門',
  '松江南京',
  '台北小巨蛋',
  '南京三民',
  '松山',

  // ===== 中和新蘆線 =====
  '忠孝新生',
  '行天宮',
  '中山國小',
  '大橋頭',

  // ===== 板南線 =====
  '龍山寺',
  '善導寺',
  '忠孝敦化',
  '國父紀念館',
  '市政府',
  '永春',
  '後山埤',
  '昆陽',
  '南港'

],


      // ===== 新北市 =====

      '新北市': [

        '九份',
        '淡水',
        '北海岸',
        '福隆',
      ],


      // ===== 基隆市 =====

      '基隆市': [
 '正濱漁港',
  '和平島',
  '八斗子',
  '外木山',
  '基隆市區',
  '暖暖'
      ],


      // ===== 桃園市 =====

      '桃園市': [

      
  '大溪',
  '青埔',
  '龍潭',
  '石門水庫',
  '中壢',
  '新屋',
  '觀音',
  '大園',
  '桃園市區'
],

      


      // ===== 新竹縣市 =====

      '新竹縣市': [

     '內灣',
  '北埔',
  '關西',
  '峨眉',
  '新埔',
  '湖口',
  '竹北',
  '新竹市區',
  '南寮',
  '香山'

      ]

    };



    // ========================================
    // HTML 元素
    // ========================================

    const play = document.getElementById('play');

    const place = document.getElementById('place');

    const caption = document.getElementById('caption');

    const hint = document.getElementById('hint');

    const subtext = document.getElementById('subtext');



    // ========================================
    // 系統狀態
    // ========================================

    let intervalId = null;

    let running = false;

    let last = -1;


    // 1 = 縣市選擇
    // 2 = 景點選擇

    let stage = 1;


    // 已選中的縣市

    let selectedCity = null;


    // 已選中的景點

    let selectedPlace = null;


    // 目前輪播清單

    let currentOptions = destinations;



    // ========================================
    // 隨機輪播
    // ========================================

    function nextDestination() {

      if (!currentOptions.length) return;


      let i = Math.floor(
        Math.random() * currentOptions.length
      );


      // 避免連續出現相同選項

      if (
        currentOptions.length > 1 &&
        i === last
      ) {

        i = (i + 1) % currentOptions.length;

      }


      last = i;


      place.textContent = currentOptions[i];

    }



    // ========================================
    // 開始輪播
    // ========================================

    function start() {

      if (intervalId !== null) {

        clearInterval(intervalId);

      }


      running = true;

      last = -1;


      place.classList.remove('pop');


      // 第一階段：縣市

      if (stage === 1) {

        currentOptions = destinations;

        caption.textContent =
          'WHERE ARE WE GOING?';

        hint.textContent =
          '👆 輕觸畫面任意處，即可暫停';

        subtext.textContent =
          '第一階段：命運縣市選擇 ✨';

      }


      // 第二階段：景點

      else {

        currentOptions =
          attractions[selectedCity];

        caption.textContent =
          'NEXT DESTINATION';

        hint.textContent =
          '👆 輕觸畫面任意處，即可暫停';

        subtext.textContent =
          '第二階段：' +
          selectedCity +
          ' 的目的地 💗';

      }


      // 立即顯示第一個隨機結果

      nextDestination();


      // 每 0.05 秒切換一次

      intervalId = setInterval(
        nextDestination,
        50
      );

    }



    // ========================================
    // 停止輪播
    // ========================================

    function stop() {

      clearInterval(intervalId);

      intervalId = null;

      running = false;



      // 第一階段停止

      if (stage === 1) {

        selectedCity = place.textContent;


        caption.textContent =
          '🎉 CITY UNLOCKED 🎉';


        hint.textContent =
          '👆 再輕觸一次，抽選目的地';


        subtext.textContent =
          '命運選中了 ' +
          selectedCity +
          ' 💗';

      }



      // 第二階段停止

      else {

        selectedPlace = place.textContent;


        caption.textContent =
          '🎉 TODAY’S DESTINATION 🎉';


        hint.textContent =
          '🔄 再輕觸一次，重新開始';


        subtext.textContent =
          selectedCity +
          '・' +
          selectedPlace +
          ' 💗';

      }



      // 停止時播放放大動畫

      place.classList.remove('pop');

      void place.offsetWidth;

      place.classList.add('pop');

    }



    // ========================================
    // 點擊畫面控制
    // ========================================

    function toggle() {


      // 正在輪播：立即暫停

      if (running) {

        stop();

        return;

      }



      // 第一階段結束：
      // 進入第二階段

      if (stage === 1) {

        stage = 2;

        start();

        return;

      }



      // 第二階段結束：
      // 回到第一階段

      if (stage === 2) {

        stage = 1;

        selectedCity = null;

        selectedPlace = null;

        start();

      }

    }



    // ========================================
    // 手機 / 電腦點擊
    // ========================================

    play.addEventListener(
      'click',
      toggle
    );



    // ========================================
    // 鍵盤控制
    // ========================================

    play.addEventListener(
      'keydown',
      e => {

        if (
          e.key === 'Enter' ||
          e.key === ' '
        ) {

          e.preventDefault();

          toggle();

        }

      }
    );



    // ========================================
    // 切換分頁時暫停
    // ========================================

    document.addEventListener(
      'visibilitychange',
      () => {

        if (document.hidden && running) {

          clearInterval(intervalId);

          intervalId = null;

          running = false;


          caption.textContent = 'PAUSED';


          hint.textContent =
            '🔄 輕觸畫面重新開始';

        }

      }
    );



    // ========================================
    // 網站開啟時自動開始
    // ========================================

    start();


  </script>

</body>
</html>
